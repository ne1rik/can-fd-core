name: CAN FD CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Добавлен libfl-dev, который содержит недостающий FlexLexer.h
          sudo apt-get install -y git make autoconf g++ flex bison help2man libfl-dev
          
      - name: Install Verilator
        run: |
          git clone https://github.com/verilator/verilator.git
          cd verilator
          git checkout v5.036
          autoconf
          ./configure
          make -j$(nproc)
          sudo make install
          cd ..
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cocotb pytest
          
      - name: Run Cocotb tests
        run: make
