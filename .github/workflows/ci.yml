name: CAN FD CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ wget
          
      - name: Install OSS CAD Suite (Verilator 5.055+)
        run: |
          cd /tmp
          wget -q https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2024-09-19/oss-cad-suite-linux-x64-20240919.tgz
          tar -xzf oss-cad-suite-linux-x64-20240919.tgz
          echo "/tmp/oss-cad-suite/bin" >> $GITHUB_PATH
          
      - name: Verify Verilator version
        run: |
          verilator --version
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cocotb pytest pytest-asyncio cocotb-coverage
          
      - name: Clean build artifacts
        run: |
          rm -rf sim_build sim_build_aux
          
      - name: Run Cocotb tests (TX regression)
        run: make
        env:
          PYTHONPATH: ${{ github.workspace }}/tb:${{ github.workspace }}:${{ env.PYTHONPATH }}
          
      - name: Run Cocotb tests (APB3 stub + reference anchors)
        run: make -f Makefile.aux
        env:
          PYTHONPATH: ${{ github.workspace }}/tb:${{ github.workspace }}:${{ env.PYTHONPATH }}
          
      - name: Run pytest (kit import + driver tests)
        run: PYTHONPATH=.:tb pytest tests/ -v
