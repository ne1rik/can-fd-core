name: CAN FD CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make autoconf g++ flex bison help2man libfl-dev
          
      - name: Build and install Verilator 5.036
        run: |
          git clone https://github.com/verilator/verilator.git
          cd verilator
          git checkout v5.036
          autoconf
          ./configure
          make -j$(nproc)
          sudo make install
          cd ..
          verilator --version
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cocotb pytest pytest-asyncio cocotb-coverage
          
      - name: Clean build artifacts
        run: |
          rm -rf sim_build sim_build_aux
          
      - name: Run Cocotb tests (TX regression)
        run: make
        env:
          PYTHONPATH: ${{ github.workspace }}/tb:${{ github.workspace }}:${{ env.PYTHONPATH }}
          
      - name: Run Cocotb tests (APB3 stub + reference anchors)
        run: make -f Makefile.aux
        env:
          PYTHONPATH: ${{ github.workspace }}/tb:${{ github.workspace }}:${{ env.PYTHONPATH }}
          
      - name: Run pytest (kit import + driver tests)
        run: PYTHONPATH=.:tb pytest tests/ -v
